<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Works art</title>
<!--
  Works covers and case banners, drawn in HTML and CSS from real logos, real numbers and brand colours.
  No AI images. Open art.html#events (any id from DESIGNS below) in a browser to preview one.
  Render all to JPG:  node tools/works-art/render.js
-->
<style>
@font-face { font-family: 'Inter'; src: url(fonts/inter-latin.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Cormorant'; src: url(fonts/cormorant-upright-600.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: 'Cormorant'; src: url(fonts/cormorant-upright-500.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: 'Mansalva'; src: url(fonts/mansalva-400.woff2) format('woff2'); }
:root {
  --ink: #15191c; --ink2: #1f2427; --cream: #f4f1ea; --peach: #ffd9b3; --sage: #6f906f; --sand: #dbd3b5;
  --mute: rgba(244, 241, 234, 0.55); --line: rgba(244, 241, 234, 0.16);
  --f1: #e4007c; --f2: #0093d0; --f3: #00a54f; --f4: #8cc63f; --f5: #ffe600; --f6: #f7931e; --f7: #ec1c24;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: var(--ink); overflow: hidden; }
body { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: var(--cream); -webkit-font-smoothing: antialiased; }
#art { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
.abs { position: absolute; }
.center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.serif { font-family: 'Cormorant', serif; font-weight: 600; letter-spacing: -0.01em; font-feature-settings: 'lnum' 1; font-variant-numeric: lining-nums; white-space: nowrap; }
.hand { font-family: 'Mansalva', cursive; }
.kicker { font-size: 1.15vw; letter-spacing: 0.32em; text-transform: uppercase; color: var(--mute); font-weight: 500; }
.big { line-height: 0.86; }
.chip { display: inline-flex; align-items: center; gap: .5em; padding: .55em 1.05em; border: 1px solid var(--line); border-radius: 999px; font-size: 1.05vw; color: var(--cream); background: rgba(255,255,255,0.03); }
.grain::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .09; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"); }
.vignette::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.45)); }
.logo { object-fit: contain; display: block; }
.card { background: var(--ink2); border: 1px solid var(--line); border-radius: 1.4vw; }
.star { color: var(--peach); letter-spacing: .08em; }
</style>
</head>
<body>
<div id="art" class="grain vignette"></div>
<script>
const L = (n) => `../../source/logos/${n}.png`
const FAN = ['var(--f1)', 'var(--f2)', 'var(--f3)', 'var(--f4)', 'var(--f5)', 'var(--f6)', 'var(--f7)']

// Cloverdale-style colour fan: blades rotating out from a pivot
function fan({ x, y, len, width, from = -8, step = 11, op = 1 }) {
  return FAN.map((c, i) => `<div class="abs" style="left:${x}px;top:${y}px;width:${len}px;height:${width}px;background:${c};opacity:${op};
    transform-origin:0 50%;transform:rotate(${from - i * step}deg);border-radius:0 ${width / 2}px ${width / 2}px 0;
    box-shadow:0 6px 30px rgba(0,0,0,.35)"></div>`).join('')
}
function calendar({ x, y, cell, gap, done = 30, start = 0, label = true }) {
  let h = ''
  for (let i = 0; i < 35; i++) {
    const d = i - start + 1
    if (d < 1 || d > 30) continue
    const r = Math.floor(i / 7), c = i % 7
    const on = d <= done
    h += `<div class="abs" style="left:${x + c * (cell + gap)}px;top:${y + r * (cell + gap)}px;width:${cell}px;height:${cell}px;border-radius:${cell * 0.16}px;
      background:${on ? 'var(--f7)' : 'transparent'};border:1px solid ${on ? 'transparent' : 'var(--line)'};
      display:flex;align-items:flex-end;justify-content:flex-start;padding:${cell * 0.1}px;font:600 ${cell * 0.26}px Inter;color:${on ? '#fff' : 'var(--mute)'}">${label ? d : ''}</div>`
  }
  return h
}
function swatches({ x, y, w, h, cols, rows, seed = 1 }) {
  let s = '', k = seed
  const rnd = () => (k = (k * 9301 + 49297) % 233280) / 233280
  const cw = w / cols, ch = h / rows
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const hue = (c / cols) * 360 + rnd() * 18, sat = 25 + rnd() * 45, lig = 30 + (r / rows) * 50 + rnd() * 8
    s += `<div class="abs" style="left:${x + c * cw}px;top:${y + r * ch}px;width:${cw - 2}px;height:${ch - 2}px;background:hsl(${hue},${sat}%,${lig}%)"></div>`
  }
  return s
}
function phone({ x, y, w, inner, rot = 0 }) {
  const h = w * 2.05
  return `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${w * 0.14}px;background:#0d0f11;
    border:${w * 0.025}px solid #2b3135;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:rotate(${rot}deg);overflow:hidden">${inner}</div>`
}
function pin({ x, y, r, c = 'var(--peach)' }) {
  return `<div class="abs" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;border:2px solid ${c};background:${c}22"></div>
    <div class="abs" style="left:${x - 7}px;top:${y - 7}px;width:14px;height:14px;border-radius:50%;background:${c};box-shadow:0 0 0 6px ${c}33"></div>`
}
function mapGrid(W, H) {
  let s = `<div class="abs" style="inset:0;background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/80px 80px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/80px 80px;opacity:.5"></div>`
  // a few "roads"
  s += `<div class="abs" style="left:-10%;top:58%;width:130%;height:6px;background:rgba(244,241,234,.12);transform:rotate(-9deg)"></div>
        <div class="abs" style="left:30%;top:-10%;width:6px;height:130%;background:rgba(244,241,234,.1);transform:rotate(14deg)"></div>
        <div class="abs" style="left:-10%;top:28%;width:130%;height:3px;background:rgba(244,241,234,.08);transform:rotate(6deg)"></div>`
  return s
}
