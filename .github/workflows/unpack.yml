name: Unpack site upload

# One-time helper: joins site.tgz.part* (uploaded through the browser), extracts the repo files,
# commits them and removes the parts. Run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join and extract
        run: |
          ls -l site.tgz.part*
          cat site.tgz.part* > /tmp/site.tgz
          echo "sha256: $(sha256sum /tmp/site.tgz | cut -c1-16)"
          tar -xzf /tmp/site.tgz
          git rm -q --cached site.tgz.part* || true
          rm -f site.tgz.part*
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add portfolio site files" || echo "nothing to commit"
          git push
